name: Bug report
description: Crash, wrong output, or API misbehavior
labels: ["bug"]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before opening
      options:
        - label: I searched open and closed issues, open PRs and recent commits for this, and it is not already reported or fixed
          required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How badly this affects you
      options:
        - high (blocks my use of sushi)
        - medium (workaround exists)
        - low (minor annoyance)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server / API (chat, completions, messages, responses, embeddings)
        - Tool calling / agent harness (Claude Code, pi, opencode, ...)
        - CLI / launch
        - Crash (SIGSEGV / process died)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sushi version
      description: From `sushi --version`
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware + macOS
      placeholder: "M4 Max 128 GB, macOS 26.6.2"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: Exact HF repo + quant, and any spec settings (MTP / drafter / kv-quant)
      placeholder: "ddalcu/Qwen3.8-27B-MLX-Serve-8bit, MTP depth 6"
  - type: textarea
    id: what
    attributes:
      label: What happened vs what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Client used (curl / agent), endpoint, stream or non-stream, and the smallest request that shows it. If you can, retry with `stream:false` first.
      placeholder: |
        1. Launch with ...
        2. curl http://127.0.0.1:8080/v1/chat/completions -d '...'
        3. ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Server log tail
      description: "`~/.sushi/logs/sushi-<port>.log` — last ~50 lines around the failure (relaunch with `--log-level debug` if possible). For crashes, attach the macOS crash report (.ips) too."
      render: text
